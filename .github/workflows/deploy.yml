# .github/workflows/deploy.yml
name: Deploy Ascorpi to VPS via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.optimized  # Use optimized Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ascorpi-ascorpi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ascorpi-ascorpi:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            cd ${{ secrets.APP_DIR }}

            # Pull latest images
            echo "📦 Pulling latest image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ascorpi-ascorpi:latest

            # Stop and remove old container
            echo "🛑 Stopping existing container..."
            docker compose down || true

            # Start new container
            echo "▶️ Starting new container..."
            docker compose up -d

            # Wait for container to be healthy
            echo "⏳ Waiting for container to be healthy..."
            sleep 10
            docker ps

            # Clean up old images
            echo "🧹 Cleaning up..."
            docker image prune -f

            # Check container status
            echo "📊 Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "✅ Deployment completed!"
